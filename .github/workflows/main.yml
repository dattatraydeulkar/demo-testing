name: test ci cd branch

on:
  push:
    branches:
      - main
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: install dependencies
        run: npm install

      - name: run build
        run: npm run build

      - name: run lint
        run: npm run lint
